[workspace]
resolver = "2"
members = [
    "crates/agentlock-core",
    "crates/agentlock-spec",
    "crates/agentlock-fs",
    "crates/agentlock-hash",
    "crates/agentlock-atep",
    "crates/agentlock-bundle",
    "crates/agentlock-validate",
    "crates/agentlock-diff",
    "crates/agentlock-contract",
    "crates/agentlock-replay-local",
    "crates/agentlock-attestation",
    "crates/agentlock-report",
    "crates/agentlock-cloud-client",
    "crates/agentlock-config",
    "crates/agentlock-diagnostics",
    "crates/agentlock-cli",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"
version = "0.1.0"
homepage = "https://agentlock.dev"
repository = "https://github.com/agentlock/agentlock-cli"

[workspace.dependencies]
# Internal
agentlock-core = { path = "crates/agentlock-core", version = "0.1.0" }
agentlock-spec = { path = "crates/agentlock-spec", version = "0.1.0" }
agentlock-fs = { path = "crates/agentlock-fs", version = "0.1.0" }
agentlock-hash = { path = "crates/agentlock-hash", version = "0.1.0" }
agentlock-atep = { path = "crates/agentlock-atep", version = "0.1.0" }
agentlock-bundle = { path = "crates/agentlock-bundle", version = "0.1.0" }
agentlock-validate = { path = "crates/agentlock-validate", version = "0.1.0" }
agentlock-diff = { path = "crates/agentlock-diff", version = "0.1.0" }
agentlock-contract = { path = "crates/agentlock-contract", version = "0.1.0" }
agentlock-replay-local = { path = "crates/agentlock-replay-local", version = "0.1.0" }
agentlock-attestation = { path = "crates/agentlock-attestation", version = "0.1.0" }
agentlock-report = { path = "crates/agentlock-report", version = "0.1.0" }
agentlock-cloud-client = { path = "crates/agentlock-cloud-client", version = "0.1.0" }
agentlock-config = { path = "crates/agentlock-config", version = "0.1.0" }
agentlock-diagnostics = { path = "crates/agentlock-diagnostics", version = "0.1.0" }

# CLI / parsing
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# Async / runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ciborium = "0.2"
toml = "0.8"

# Hashing & crypto
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
hex = "0.4"
base64 = "0.22"

# Bundles & archives
tar = "0.4"
zstd = "0.13"

# Schema validation
jsonschema = { version = "0.18", default-features = false }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }

# Errors / diagnostics
thiserror = "1"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utility
ulid = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
secrecy = { version = "0.10", features = ["serde"] }
zerocopy = "0.7"
indicatif = "0.17"
console = "0.15"
glob = "0.3"
directories = "5"
tera = "1"
pulldown-cmark = "0.12"
crc32fast = "1.4"

# Test
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1.5"
rand = "0.8"
rand_core = "0.6"
wiremock = "0.6"
