[workspace]
resolver = "2"
members = [
    "crates/agenomic-core",
    "crates/agenomic-spec",
    "crates/agenomic-fs",
    "crates/agenomic-hash",
    "crates/agenomic-atep",
    "crates/agenomic-bundle",
    "crates/agenomic-validate",
    "crates/agenomic-diff",
    "crates/agenomic-contract",
    "crates/agenomic-replay-local",
    "crates/agenomic-attestation",
    "crates/agenomic-report",
    "crates/agenomic-cloud-client",
    "crates/agenomic-config",
    "crates/agenomic-diagnostics",
    "crates/agenomic-detect",
    "crates/agenomic-os",
    "crates/agenomic-compile",
    "crates/agenomic-policy",
    "crates/agenomic-governance",
    "crates/agenomic-gate",
    "crates/agenomic-cli",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.1-rc.0"
homepage = "https://agenomic.io"
repository = "https://github.com/treansai/agenomic-cli"

[workspace.dependencies]
# Internal
agenomic-core = { path = "crates/agenomic-core", version = "0.1.1-rc.0" }
agenomic-spec = { path = "crates/agenomic-spec", version = "0.1.1-rc.0" }
agenomic-fs = { path = "crates/agenomic-fs", version = "0.1.1-rc.0" }
agenomic-hash = { path = "crates/agenomic-hash", version = "0.1.1-rc.0" }
agenomic-atep = { path = "crates/agenomic-atep", version = "0.1.1-rc.0" }
agenomic-bundle = { path = "crates/agenomic-bundle", version = "0.1.1-rc.0" }
agenomic-validate = { path = "crates/agenomic-validate", version = "0.1.1-rc.0" }
agenomic-diff = { path = "crates/agenomic-diff", version = "0.1.1-rc.0" }
agenomic-contract = { path = "crates/agenomic-contract", version = "0.1.1-rc.0" }
agenomic-replay-local = { path = "crates/agenomic-replay-local", version = "0.1.1-rc.0" }
agenomic-attestation = { path = "crates/agenomic-attestation", version = "0.1.1-rc.0" }
agenomic-report = { path = "crates/agenomic-report", version = "0.1.1-rc.0" }
agenomic-cloud-client = { path = "crates/agenomic-cloud-client", version = "0.1.1-rc.0" }
agenomic-config = { path = "crates/agenomic-config", version = "0.1.1-rc.0" }
agenomic-diagnostics = { path = "crates/agenomic-diagnostics", version = "0.1.1-rc.0" }
agenomic-detect = { path = "crates/agenomic-detect", version = "0.1.1-rc.0" }
agenomic-os = { path = "crates/agenomic-os", version = "0.1.1-rc.0" }
agenomic-compile = { path = "crates/agenomic-compile", version = "0.1.1-rc.0" }
agenomic-policy = { path = "crates/agenomic-policy", version = "0.1.1-rc.0" }
agenomic-governance = { path = "crates/agenomic-governance", version = "0.1.1-rc.0" }
agenomic-gate = { path = "crates/agenomic-gate", version = "0.1.1-rc.0" }

# CLI / parsing
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
git-version = "0.3"

# Async / runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ciborium = "0.2"
toml = "0.8"

# Git (local-only, offline; pure-Rust, no C deps → clean cross-compilation).
# default-features = false to drop gix's network protocol/transport stack
# (gix-protocol/gix-transport) — this tool never fetches. `max-performance-safe`
# + `sha1` keep the (pure-Rust) hashing/zlib backends coherent; `basic`
# (revision + index + blob-diff) and `status` cover local reads, dirty-tree
# detection, staging, and commit creation.
gix = { version = "0.84", default-features = false, features = [
    "max-performance-safe",
    "sha1",
    "basic",
    "status",
    "tree-editor",
] }

# Hashing & crypto
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
hex = "0.4"
base64 = "0.22"

# Bundles & archives
tar = "0.4"
zstd = "0.13"

# Schema validation
jsonschema = { version = "0.18", default-features = false, features = ["draft201909", "draft202012"] }

# Policy (OPA / Rego). Pure-Rust interpreter; no external `opa` binary, keeps
# the offline-first invariant. `arc` makes the engine Send + Sync.
regorus = { version = "0.10", default-features = false, features = ["std", "arc", "regex"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }

# Errors / diagnostics
thiserror = "1"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utility
ulid = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
secrecy = { version = "0.10", features = ["serde"] }
zerocopy = "0.7"
indicatif = "0.17"
console = "0.15"
glob = "0.3"
directories = "5"
tera = "1"
pulldown-cmark = "0.12"
crc32fast = "1.4"

# Test
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1.5"
rand = "0.8"
rand_core = "0.6"
wiremock = "0.6"
