[package]
name = "agenomic-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Agenomic public CLI binary"
# This crate ships two binaries (`agenomic` + the `agm` alias); pick the
# canonical one for bare `cargo run -p agenomic-cli` (e.g. the CI doctor step).
default-run = "agenomic"

[[bin]]
name = "agenomic"
path = "src/main.rs"

[dependencies]
agenomic-core = { workspace = true }
agenomic-spec = { workspace = true }
agenomic-fs = { workspace = true }
agenomic-hash = { workspace = true }
agenomic-atep = { workspace = true }
agenomic-bundle = { workspace = true }
agenomic-validate = { workspace = true }
agenomic-diff = { workspace = true }
agenomic-contract = { workspace = true }
agenomic-replay-local = { workspace = true }
agenomic-attestation = { workspace = true }
agenomic-report = { workspace = true }
agenomic-config = { workspace = true }
agenomic-cloud-client = { workspace = true }
agenomic-diagnostics = { workspace = true }
agenomic-detect = { workspace = true }
agenomic-os = { workspace = true }
agenomic-compile = { workspace = true }
agenomic-policy = { workspace = true }
agenomic-governance = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
git-version = { workspace = true }
tokio = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
secrecy = { workspace = true }
ciborium = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
ulid = { workspace = true }
console = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
wiremock = { workspace = true }
