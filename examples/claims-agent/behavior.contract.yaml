spec_version: '0.1'
contract:
  id: 'contract://treans/claims-agent/v1'
  description: 'Behavioral contract for the claims-agent. Final decisions require human approval.'
  rules:
    - id: 'r1-output-language'
      type: 'language_match_field_present'
      severity: 'medium'
      description: 'The output must declare the language used.'
    - id: 'r2-policy-source'
      type: 'policy_source_required'
      severity: 'high'
      description: 'When the agent recommends compensation, it must reference a policy source.'
    - id: 'r3-final-decision-approval'
      type: 'no_final_decision_without_approval'
      severity: 'critical'
      description: 'A final compensation decision requires human approval in metadata.'
