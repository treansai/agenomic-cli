name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run -p agenomic-cli -- doctor

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p agenomic-cli --release
      - run: ./target/release/agenomic validate ./examples/claims-agent --level strict
      - run: ./target/release/agenomic validate ./examples/support-agent --level strict
      - run: ./target/release/agenomic validate ./examples/trading-risk-agent --level strict

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Run cargo-deny on the host runner (not the musl container action), so the
      # repo's rust-toolchain.toml resolves to the installed stable-gnu toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  connector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
      # Launched Claude Code sessions require their sandbox (bubblewrap and
      # socat on Linux); the unit tests start the bundled runtime. Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor.
      - name: sandbox for launched runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev true
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The end to end suite skips without AGENOMIC_E2E_ENDPOINT.
      - run: npm test
