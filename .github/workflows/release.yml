name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build -p agenomic-cli --release --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build -p agenomic-cli --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          name="agenomic-${TARGET}"
          stage="dist/stage/${name}"
          mkdir -p "${stage}"
          if [[ "${TARGET}" == *windows* ]]; then
            cp "target/${TARGET}/release/agenomic.exe" "${stage}/agenomic.exe"
            cp "target/${TARGET}/release/agm.exe" "${stage}/agm.exe"
            (cd dist/stage && 7z a "../${name}.zip" "${name}")
          else
            cp "target/${TARGET}/release/agenomic" "${stage}/agenomic"
            cp "target/${TARGET}/release/agm" "${stage}/agm"
            (cd dist/stage && tar czf "../${name}.tar.gz" "${name}")
          fi
          rm -rf dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: agenomic-${{ matrix.target }}
          path: dist/

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Compute checksums
        run: |
          set -e
          cd dist
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | xargs shasum -a 256 > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/checksums.txt
