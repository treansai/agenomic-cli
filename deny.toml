# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # webpki-roots (pulled by reqwest) ships under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
# cargo-deny 0.19 removed the `[licenses].deny` list: anything not in `allow`
# is denied (so GPL-3.0 / AGPL / SSPL remain disallowed by omission).
confidence-threshold = 0.8

# The workspace crates are Agenomic Community code under AGPL-3.0-only.
# They are listed as explicit exceptions rather than added to `allow`, so a
# third-party AGPL dependency still fails the check.
[[licenses.exceptions]]
name = "agenomic-atep"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "agenomic-attestation"
allow = ["AGPL-3.0-only"]

